services:
  postgres: {image: postgres:16-alpine, environment: {POSTGRES_USER: synq, POSTGRES_PASSWORD: synq, POSTGRES_DB: synq}, ports: ['5432:5432'], healthcheck: {test: ['CMD-SHELL','pg_isready -U synq'], interval: 5s, timeout: 3s, retries: 10}}
  redis: {image: redis:7-alpine, ports: ['6379:6379']}
  api: {build: ., environment: {PORT: 3000, DISCOVERY_TOKEN_SECRET: local-only}, ports: ['3000:3000'], depends_on: {postgres: {condition: service_healthy}}}
